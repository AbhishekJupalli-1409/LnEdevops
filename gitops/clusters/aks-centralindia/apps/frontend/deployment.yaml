apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: apps
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ${ACR_LOGIN_SERVER}/employee-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Browser-reachable API via ingress /api → private ACI (see
            # ingress/ingress.yaml). Do NOT use the ACI private IP here —
            # the user's browser cannot route to 10.10.x.x.
            - name: API_BASE_URL
              value: "/api"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
