apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: apps
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ${ACR_LOGIN_SERVER}/employee-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # sample-react-app does: API_BASE_URL + "/api/v1/employees"
            # Ingress rewrites /api/* → /* on ACI, so "/api" becomes
            # /api/api/v1/... externally → /api/v1/... on the backend.
            # Must NOT be the ACI private IP (browser cannot reach it).
            - name: API_BASE_URL
              value: "/api"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
