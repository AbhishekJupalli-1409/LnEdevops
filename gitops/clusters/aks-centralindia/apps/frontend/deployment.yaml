apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: apps
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ${ACR_LOGIN_SERVER}/employee-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Consumed at container *startup* (envsubst into env.js), not
            # build time - see the frontend Dockerfile's CMD. Must be named
            # exactly API_BASE_URL to match public/env.template.js.
            - name: API_BASE_URL
              value: "http://${BACKEND_PRIVATE_IP}:${BACKEND_PORT}"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
