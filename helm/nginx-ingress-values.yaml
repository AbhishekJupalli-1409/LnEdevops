# Values for the official ingress-nginx chart (repo: https://kubernetes.github.io/ingress-nginx)
# Small/basic footprint per the platform's compute guidance.
controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local   # preserves real client IP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  ingressClassResource:
    name: nginx
    default: true

defaultBackend:
  enabled: false
