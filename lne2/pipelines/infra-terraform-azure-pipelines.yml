# Azure Pipelines - Terraform for the voting platform.
# Runs on ubuntu-latest. Resource creation is ARM. kubectl is not used here.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - terraform/**

parameters:
  - name: azureServiceConnection
    displayName: 'Azure Resource Manager service connection name'
    type: string
    default: 'voteapp-arm'

variables:
  - group: voteapp-shared-vars
  - name: tfWorkingDir
    value: '$(Build.SourcesDirectory)/terraform/envs/centralindia'
  - name: tfVersion
    value: '1.9.5'
  - name: azureSubscriptionId
    value: '0b6312f9-7bd8-4826-85aa-c805a64c18d4'
  - name: tfStateResourceGroup
    value: 'rg-voteapp-tfstate-cin'
  - name: tfStateStorageAccount
    value: 'tfstatevote3gwpva'
  - name: tfStateContainer
    value: 'tfstate'

stages:
  - stage: Plan
    displayName: 'terraform plan'
    jobs:
      - job: plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'terraform init and plan'
            env:
              AZDO_PAT: $(azdoPersonalAccessToken)
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                TF_TMP=$(mktemp -d)
                curl -fsSL -o "$TF_TMP/tf.zip" "https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip"
                unzip -o "$TF_TMP/tf.zip" -d "$TF_TMP"
                sudo install -m 755 "$TF_TMP/terraform" /usr/local/bin/terraform
                rm -rf "$TF_TMP"
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                az account set --subscription "$(azureSubscriptionId)"
                export ARM_SUBSCRIPTION_ID="$(azureSubscriptionId)"
                # voteapp-arm is a federated connection (az login --federated-token).
                # There is no client secret. Terraform must use the same OIDC token.
                if [ -n "${idToken:-}" ]; then
                  export ARM_USE_OIDC=true
                  export ARM_OIDC_TOKEN=$idToken
                else
                  export ARM_CLIENT_SECRET=$servicePrincipalKey
                fi
                if [ -z "${AZDO_PAT:-}" ]; then
                  echo "##vso[task.logissue type=error]Set secret azdoPersonalAccessToken in voteapp-shared-vars."
                  exit 1
                fi
                export TF_VAR_azdo_personal_access_token="$AZDO_PAT"
                cd "$(tfWorkingDir)"
                terraform init \
                  -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                  -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                  -backend-config="container_name=$(tfStateContainer)" \
                  -backend-config="key=voteapp.terraform.tfstate"
                terraform plan -input=false -detailed-exitcode || test $? -eq 2

  - stage: Apply
    displayName: 'terraform apply'
    dependsOn: Plan
    jobs:
      - deployment: apply
        environment: 'voteapp-infra-production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: 'terraform apply'
                  env:
                    AZDO_PAT: $(azdoPersonalAccessToken)
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      TF_TMP=$(mktemp -d)
                      curl -fsSL -o "$TF_TMP/tf.zip" "https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip"
                      unzip -o "$TF_TMP/tf.zip" -d "$TF_TMP"
                      sudo install -m 755 "$TF_TMP/terraform" /usr/local/bin/terraform
                      rm -rf "$TF_TMP"
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_TENANT_ID=$tenantId
                      az account set --subscription "$(azureSubscriptionId)"
                      export ARM_SUBSCRIPTION_ID="$(azureSubscriptionId)"
                      if [ -n "${idToken:-}" ]; then
                        export ARM_USE_OIDC=true
                        export ARM_OIDC_TOKEN=$idToken
                      else
                        export ARM_CLIENT_SECRET=$servicePrincipalKey
                      fi
                      export TF_VAR_azdo_personal_access_token="$AZDO_PAT"
                      cd "$(tfWorkingDir)"
                      terraform init \
                        -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                        -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                        -backend-config="container_name=$(tfStateContainer)" \
                        -backend-config="key=voteapp.terraform.tfstate"
                      terraform apply -input=false -auto-approve
                      terraform output
