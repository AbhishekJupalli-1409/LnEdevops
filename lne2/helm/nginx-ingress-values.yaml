controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  ingressClassResource:
    name: nginx
    default: true

defaultBackend:
  enabled: false
