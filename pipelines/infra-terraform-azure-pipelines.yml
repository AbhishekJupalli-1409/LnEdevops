# Azure Pipelines - Terraform infra (policy, network, ACR, AKS, ACI,
# PostgreSQL, Key Vault, private agent VM). Runs on ubuntu-latest: every
# resource here is created via ARM, so this pipeline never needs to reach
# into the private VNet directly.
#
# Prerequisite: terraform/bootstrap has already been applied once (manually,
# with local state) to create the state storage account - see its own header
# comment and docs/RUNBOOK.md step 0.
trigger:
  branches:
    include: [main]
  paths:
    include: [terraform/**]

# Service connections are validated at COMPILE time. A runtime macro like
# $(armServiceConnection) from a variable group often does not expand, which
# produces: "service connection $(armServiceConnection) which could not be found".
# Set this to the EXACT name under Project settings > Service connections.
parameters:
  - name: azureServiceConnection
    displayName: 'Azure Resource Manager service connection name'
    type: string
    default: 'empapp-arm'   # <-- change to your real connection name

variables:
  # Do not define azdoPersonalAccessToken here — a YAML value: '' beats the
  # variable-group secret and the agent VM registers with an empty PAT.
  - group: empapp-shared-vars
  - name: tfWorkingDir
    value: '$(Build.SourcesDirectory)/terraform/envs/centralindia'
  - name: tfVersion
    value: '1.9.5'
  # Still required in empapp-shared-vars (from terraform/bootstrap outputs):
  # tfStateResourceGroup, tfStateStorageAccount, tfStateContainer
  # Also set secret azdoPersonalAccessToken (Azure DevOps PAT, Agent Pools
  # read & manage). The ARM service connection cannot authenticate to
  # dev.azure.com. Needed for the private agent VM to register.

stages:
  - stage: Plan
    displayName: 'terraform plan'
    jobs:
      - job: plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'terraform init & validate'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              AZDO_PAT: $(azdoPersonalAccessToken)
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                # Unzip into a temp dir — the repo already has a terraform/ folder,
                # so extracting a binary named "terraform" in the workspace fails.
                TF_TMP=$(mktemp -d)
                curl -fsSL -o "$TF_TMP/tf.zip" "https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip"
                unzip -o "$TF_TMP/tf.zip" -d "$TF_TMP"
                sudo install -m 755 "$TF_TMP/terraform" /usr/local/bin/terraform
                rm -rf "$TF_TMP"
                terraform version
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                # azuredevops provider does not use the ARM service connection.
                # Pipeline OAuth (SYSTEM_ACCESSTOKEN) cannot register a self-hosted
                # agent. A PAT in empapp-shared-vars is required.
                if [ -z "${AZDO_PAT:-}" ]; then
                  echo "##vso[task.logissue type=error]Secret azdoPersonalAccessToken is empty. Add an Azure DevOps PAT (Agent Pools: Read & manage) to variable group empapp-shared-vars."
                  exit 1
                fi
                export AZDO_PERSONAL_ACCESS_TOKEN="$AZDO_PAT"
                export TF_VAR_azdo_personal_access_token="$AZDO_PAT"
                cd $(tfWorkingDir)
                terraform init \
                  -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                  -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                  -backend-config="container_name=$(tfStateContainer)" \
                  -backend-config="key=centralindia.terraform.tfstate"
                terraform validate
                # Previous failed applies can leave aks-empapp-cin in Azure
                # without recording it in state. Import before plan so the
                # saved plan updates the cluster instead of trying to create it.
                chmod +x "$(Build.SourcesDirectory)/scripts/terraform-import-existing-aks.sh"
                "$(Build.SourcesDirectory)/scripts/terraform-import-existing-aks.sh"

          - task: AzureCLI@2
            displayName: 'terraform plan'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              AZDO_PAT: $(azdoPersonalAccessToken)
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                if [ -z "${AZDO_PAT:-}" ]; then
                  echo "##vso[task.logissue type=error]Secret azdoPersonalAccessToken is empty. Add an Azure DevOps PAT (Agent Pools: Read & manage) to variable group empapp-shared-vars."
                  exit 1
                fi
                export AZDO_PERSONAL_ACCESS_TOKEN="$AZDO_PAT"
                export TF_VAR_azdo_personal_access_token="$AZDO_PAT"
                cd $(tfWorkingDir)
                # -var beats terraform.tfvars so an accidental empty assignment
                # cannot wipe the PAT (that produced "Invalid configuration provided for token").
                terraform plan -var-file=terraform.tfvars -var="azdo_personal_access_token=${AZDO_PAT}" -out=tfplan

          - publish: '$(tfWorkingDir)/tfplan'
            artifact: tfplan

  - stage: Apply
    displayName: 'terraform apply'
    dependsOn: Plan
    jobs:
      # deployment (not job) so Environment approval checks work
      - deployment: apply
        displayName: 'terraform apply (manual approval)'
        environment: 'empapp-infra-production'   # add an approval check on this Environment in Azure DevOps > Pipelines > Environments
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan
                - task: AzureCLI@2
                  displayName: 'terraform apply'
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    AZDO_PAT: $(azdoPersonalAccessToken)
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -e
                      TF_TMP=$(mktemp -d)
                      curl -fsSL -o "$TF_TMP/tf.zip" "https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip"
                      unzip -o "$TF_TMP/tf.zip" -d "$TF_TMP"
                      sudo install -m 755 "$TF_TMP/terraform" /usr/local/bin/terraform
                      rm -rf "$TF_TMP"
                      terraform version
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      if [ -z "${AZDO_PAT:-}" ]; then
                        echo "##vso[task.logissue type=error]Secret azdoPersonalAccessToken is empty. Add an Azure DevOps PAT (Agent Pools: Read & manage) to variable group empapp-shared-vars. Re-run Plan after adding it — a saved plan from before still has an empty token."
                        exit 1
                      fi
                      export AZDO_PERSONAL_ACCESS_TOKEN="$AZDO_PAT"
                      export TF_VAR_azdo_personal_access_token="$AZDO_PAT"
                      cd $(tfWorkingDir)
                      terraform init \
                        -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                        -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                        -backend-config="container_name=$(tfStateContainer)" \
                        -backend-config="key=centralindia.terraform.tfstate"
                      chmod +x "$(Build.SourcesDirectory)/scripts/terraform-import-existing-aks.sh"
                      "$(Build.SourcesDirectory)/scripts/terraform-import-existing-aks.sh"
                      terraform apply -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"
                      terraform output -json > tf-outputs.json
                - publish: '$(tfWorkingDir)/tf-outputs.json'
                  artifact: tf-outputs
