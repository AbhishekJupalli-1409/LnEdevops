# Azure Pipelines - Employee App FRONTEND (React)
# Repo: https://github.com/cubastion-training/sample-react-app.git
# Builds the existing Dockerfile and pushes to ACR.
trigger:
  branches:
    include: [main]

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: empapp-shared-vars   # acrLoginServer, acrServiceConnection (from the azuredevops Terraform module)
  - name: imageRepository
    value: 'employee-app-frontend'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

steps:
  - task: Docker@2
    displayName: 'Build and push frontend image to ACR'
    inputs:
      command: buildAndPush
      repository: '$(imageRepository)'
      dockerfile: '$(dockerfilePath)'
      buildContext: '$(Build.SourcesDirectory)'
      containerRegistry: '$(acrServiceConnection)'
      tags: |
        $(tag)
        latest
