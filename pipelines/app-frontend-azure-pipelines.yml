# Azure Pipelines - Employee App FRONTEND (React)
# YAML lives in this platform repo; source + Dockerfile come from
# https://github.com/cubastion-training/sample-react-app.git
trigger:
  branches:
    include: [main]
  paths:
    include:
      - pipelines/app-frontend-azure-pipelines.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: empapp-shared-vars
  - name: imageRepository
    value: 'employee-app-frontend'
  - name: appRepo
    value: 'https://github.com/cubastion-training/sample-react-app.git'
  - name: appDir
    value: '$(Pipeline.Workspace)/app'
  - name: tag
    value: '$(Build.BuildId)'

steps:
  - checkout: none

  - script: |
      set -euo pipefail
      git clone --depth 1 --branch main "$(appRepo)" "$(appDir)"
      ls -la "$(appDir)/Dockerfile"
    displayName: 'Clone sample-react-app'

  - task: Docker@2
    displayName: 'Build and push frontend image to ACR'
    inputs:
      command: buildAndPush
      repository: '$(imageRepository)'
      dockerfile: '$(appDir)/Dockerfile'
      buildContext: '$(appDir)'
      containerRegistry: '$(acrServiceConnection)'
      tags: |
        $(tag)
        latest
