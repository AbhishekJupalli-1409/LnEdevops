# Azure Pipelines - Employee App BACKEND (Node.js)
# Repo: https://github.com/cubastion-training/sample-node-app.git
#
# COMPATIBILITY PATCH: this repo's package.json only lists mysql/mysql2 as
# Sequelize drivers, but the platform deploys PostgreSQL Flexible Server.
# Sequelize is dialect-agnostic beyond the driver + config.js's DBDIALECT
# value, so the fix is just making sure the pg driver is present in the image
# - no application code changes. This step patches package.json in the
# pipeline's own checkout, BEFORE the Docker build context is used, so the
# Dockerfile's own `RUN npm install` step picks it up. The source repo itself
# is never modified.
trigger:
  branches:
    include: [main]

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: empapp-shared-vars
  - name: imageRepository
    value: 'employee-app-backend'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

steps:
  - script: |
      set -e
      npm install pg pg-hstore --save --package-lock=false
    displayName: 'Patch: add pg/pg-hstore driver for PostgreSQL'
    workingDirectory: '$(Build.SourcesDirectory)'

  - task: Docker@2
    displayName: 'Build and push backend image to ACR'
    inputs:
      command: buildAndPush
      repository: '$(imageRepository)'
      dockerfile: '$(dockerfilePath)'
      buildContext: '$(Build.SourcesDirectory)'
      containerRegistry: '$(acrServiceConnection)'
      tags: |
        $(tag)
        latest
