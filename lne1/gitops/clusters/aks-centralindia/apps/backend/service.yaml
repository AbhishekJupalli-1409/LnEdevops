# Headless Service + Endpoints so ingress can reach the private ACI backend
# (same VNet). Flux substitutes BACKEND_PRIVATE_IP from cluster-vars.
apiVersion: v1
kind: Service
metadata:
  name: aci-backend
  namespace: apps
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: aci-backend
  namespace: apps
subsets:
  - addresses:
      - ip: ${BACKEND_PRIVATE_IP}
    ports:
      - name: http
        port: 8000
        protocol: TCP
