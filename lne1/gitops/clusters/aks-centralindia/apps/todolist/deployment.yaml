apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: apps
  labels: { app: todolist }
spec:
  # Single replica: this sample app uses a local SQLite DB inside the
  # container. With replicas>1, add/list can hit pod A while update/delete
  # hit pod B (task not found → NoneType / "issue deleting").
  replicas: 1
  selector:
    matchLabels: { app: todolist }
  template:
    metadata:
      labels: { app: todolist }
    spec:
      containers:
        - name: todolist
          image: ${ACR_LOGIN_SERVER}/todo-list-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 15
