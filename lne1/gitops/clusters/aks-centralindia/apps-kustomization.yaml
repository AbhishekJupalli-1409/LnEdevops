apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./gitops/clusters/aks-centralindia/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Substitutes ${ACR_LOGIN_SERVER}, ${BACKEND_PRIVATE_IP}, ${BACKEND_PORT}
  # from the ConfigMap written by pipelines/flux-bootstrap-azure-pipelines.yml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
