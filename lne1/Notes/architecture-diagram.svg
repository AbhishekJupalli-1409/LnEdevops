<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="LearnAndEarn Azure Cloud Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .h { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 650 12px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .t { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .s { font: 500 10px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .lbl { font: 600 10px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .leg { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="36" text-anchor="middle" class="title">LearnAndEarn — Azure Cloud Architecture</text>
  <text x="800" y="56" text-anchor="middle" class="subtitle">Central India · Terraform + Azure Pipelines + Flux GitOps · Private AKS / ACI / PostgreSQL</text>

  <!-- Internet -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="120" height="70" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="100" cy="125" r="14" fill="none" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="100" cy="125" rx="7" ry="14" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="86" y1="125" x2="114" y2="125" stroke="#64748b" stroke-width="1.5"/>
    <text x="100" y="155" text-anchor="middle" class="h2">Internet / Users</text>
  </g>

  <!-- Subscription boundary -->
  <rect x="190" y="80" width="1370" height="830" rx="16" fill="#fff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="210" y="102" class="h">Azure Subscription</text>

  <!-- Policy strip -->
  <g filter="url(#shadow)">
    <rect x="210" y="115" width="980" height="56" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <text x="224" y="136" class="h2">Azure Policy (subscription)</text>
    <rect x="224" y="144" width="120" height="18" rx="4" fill="#ffedd5"/>
    <text x="284" y="157" text-anchor="middle" class="s">Allowed locations</text>
    <rect x="354" y="144" width="130" height="18" rx="4" fill="#ffedd5"/>
    <text x="419" y="157" text-anchor="middle" class="s">Tag: Business Unit</text>
    <rect x="494" y="144" width="120" height="18" rx="4" fill="#ffedd5"/>
    <text x="554" y="157" text-anchor="middle" class="s">Tag: Cost Center</text>
    <rect x="624" y="144" width="140" height="18" rx="4" fill="#ffedd5"/>
    <text x="694" y="157" text-anchor="middle" class="s">Deny public IP on NIC</text>
  </g>

  <!-- Resource Group / shared PaaS -->
  <g filter="url(#shadow)">
    <rect x="1210" y="115" width="330" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1224" y="138" class="h2">Resource Group (platform)</text>
    <text x="1224" y="156" class="s">+ bootstrap RG: Storage Account / tfstate</text>
  </g>

  <!-- VNet -->
  <g filter="url(#shadow)">
    <rect x="210" y="190" width="980" height="560" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="230" y="214" class="h">Virtual Network (private)</text>
    <text x="230" y="230" class="s">NSGs on AKS + ACI · Private DNS linked for Postgres &amp; Key Vault</text>
  </g>

  <!-- snet-aks -->
  <g filter="url(#shadow)">
    <rect x="230" y="245" width="460" height="230" rx="10" fill="#fff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="246" y="268" class="h2">snet-aks · Private AKS</text>
    <text x="246" y="284" class="s">API private · apps via public Ingress LB</text>

    <!-- ingress -->
    <rect x="246" y="296" width="200" height="48" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="346" y="316" text-anchor="middle" class="t">ingress-nginx (Helm)</text>
    <text x="346" y="332" text-anchor="middle" class="s">LoadBalancer · public IP</text>

    <!-- frontend -->
    <rect x="246" y="356" width="130" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="311" y="376" text-anchor="middle" class="t">Frontend</text>
    <text x="311" y="392" text-anchor="middle" class="s">React · Flux · x2</text>

    <!-- todolist -->
    <rect x="390" y="356" width="130" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="455" y="376" text-anchor="middle" class="t">Todo List</text>
    <text x="455" y="392" text-anchor="middle" class="s">Flask · Flux · x2</text>

    <!-- flux -->
    <rect x="536" y="296" width="136" height="110" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="604" y="322" text-anchor="middle" class="t">Flux GitOps</text>
    <text x="604" y="340" text-anchor="middle" class="s">sync gitops/</text>
    <text x="604" y="356" text-anchor="middle" class="s">apps + Ingress</text>
    <text x="604" y="372" text-anchor="middle" class="s">cluster-vars</text>
    <text x="604" y="388" text-anchor="middle" class="s">substitutions</text>
  </g>

  <!-- path labels inside aks -->
  <text x="311" y="430" text-anchor="middle" class="s">path /emp</text>
  <text x="455" y="430" text-anchor="middle" class="s">path /to-do</text>
  <line x1="346" y1="344" x2="311" y2="356" stroke="#6366f1" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <line x1="346" y1="344" x2="455" y2="356" stroke="#6366f1" stroke-width="1.4" marker-end="url(#arrowBlue)"/>

  <!-- snet-aci -->
  <g filter="url(#shadow)">
    <rect x="710" y="245" width="220" height="140" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="726" y="268" class="h2">snet-aci (+ NSG)</text>
    <rect x="726" y="282" width="188" height="80" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="820" y="312" text-anchor="middle" class="t">ACI Backend</text>
    <text x="820" y="330" text-anchor="middle" class="s">Node / Sequelize</text>
    <text x="820" y="346" text-anchor="middle" class="s">Private IP only</text>
  </g>

  <!-- snet-postgres -->
  <g filter="url(#shadow)">
    <rect x="710" y="405" width="220" height="130" rx="10" fill="#fff" stroke="#059669" stroke-width="1.8"/>
    <text x="726" y="428" class="h2">snet-postgres</text>
    <rect x="726" y="442" width="188" height="72" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="820" y="468" text-anchor="middle" class="t">PostgreSQL Flexible</text>
    <text x="820" y="486" text-anchor="middle" class="s">VNet integration</text>
    <text x="820" y="502" text-anchor="middle" class="s">DB: employee</text>
  </g>

  <!-- snet-pe + Key Vault -->
  <g filter="url(#shadow)">
    <rect x="950" y="245" width="220" height="160" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="966" y="268" class="h2">snet-pe</text>
    <rect x="966" y="282" width="188" height="50" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="1060" y="302" text-anchor="middle" class="t">Private Endpoint</text>
    <text x="1060" y="318" text-anchor="middle" class="s">→ Key Vault</text>
    <rect x="966" y="344" width="188" height="44" rx="6" fill="#ffedd5" stroke="#c2410c"/>
    <text x="1060" y="362" text-anchor="middle" class="t">Azure Key Vault</text>
    <text x="1060" y="378" text-anchor="middle" class="s">RBAC · no public access</text>
  </g>

  <!-- ACR -->
  <g filter="url(#shadow)">
    <rect x="950" y="425" width="220" height="110" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.8"/>
    <text x="966" y="448" class="h2">Azure Container Registry</text>
    <text x="966" y="468" class="t">Basic · admin disabled</text>
    <text x="966" y="486" class="s">employee-app-frontend</text>
    <text x="966" y="502" class="s">employee-app-backend</text>
    <text x="966" y="518" class="s">todo-list-app</text>
  </g>

  <!-- snet-agent -->
  <g filter="url(#shadow)">
    <rect x="230" y="500" width="460" height="130" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.8"/>
    <text x="246" y="524" class="h2">snet-agent · self-hosted DevOps agent</text>
    <rect x="246" y="540" width="170" height="70" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="331" y="568" text-anchor="middle" class="t">Linux Agent VM</text>
    <text x="331" y="586" text-anchor="middle" class="s">no public IP on NIC</text>
    <rect x="440" y="540" width="110" height="70" rx="6" fill="#ecfeff" stroke="#0891b2"/>
    <text x="495" y="568" text-anchor="middle" class="t">NAT Gateway</text>
    <text x="495" y="586" text-anchor="middle" class="s">+ Public IP</text>
    <rect x="568" y="540" width="104" height="70" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="620" y="568" text-anchor="middle" class="t">Outbound</text>
    <text x="620" y="586" text-anchor="middle" class="s">only</text>
    <line x1="416" y1="575" x2="440" y2="575" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
    <line x1="550" y1="575" x2="568" y2="575" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  </g>

  <!-- Private DNS -->
  <g filter="url(#shadow)">
    <rect x="710" y="555" width="460" height="75" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
    <text x="726" y="578" class="h2">Private DNS zones (linked to VNet)</text>
    <text x="726" y="598" class="t">privatelink.postgres.database.azure.com</text>
    <text x="726" y="616" class="t">privatelink.vaultcore.azure.net</text>
  </g>

  <!-- Azure DevOps column -->
  <g filter="url(#shadow)">
    <rect x="1210" y="190" width="330" height="560" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="1226" y="216" class="h">Azure DevOps</text>
    <text x="1226" y="234" class="s">Project · Variable group · Endpoints</text>

    <rect x="1226" y="250" width="298" height="70" rx="6" fill="#fff" stroke="#0f766e"/>
    <text x="1240" y="272" class="t">Service connections</text>
    <text x="1240" y="290" class="s">ARM · ACR · GitHub</text>
    <text x="1240" y="306" class="s">empapp-shared-vars</text>

    <rect x="1226" y="336" width="298" height="170" rx="6" fill="#fff" stroke="#0f766e"/>
    <text x="1240" y="358" class="t">Pipelines</text>
    <text x="1240" y="378" class="s">1. infra-terraform (ubuntu)</text>
    <text x="1240" y="394" class="s">2–4. app frontend/backend/todo</text>
    <text x="1240" y="410" class="s">5. ingress-nginx Helm ★ private pool</text>
    <text x="1240" y="426" class="s">6. flux-bootstrap ★ private pool</text>
    <text x="1240" y="442" class="s">7. aci-backend-deploy</text>
    <text x="1240" y="464" class="s">★ needs Agent VM in VNet</text>
    <text x="1240" y="490" class="s">Pool: empapp-private-pool</text>

    <rect x="1226" y="522" width="298" height="100" rx="6" fill="#fff" stroke="#64748b"/>
    <text x="1240" y="544" class="t">GitHub (GitOps source)</text>
    <text x="1240" y="564" class="s">gitops/clusters/aks-centralindia</text>
    <text x="1240" y="582" class="s">Flux reconciles apps/</text>
    <text x="1240" y="600" class="s">Terraform modules in terraform/</text>

    <rect x="1226" y="640" width="298" height="90" rx="6" fill="#fff" stroke="#0ea5e9"/>
    <text x="1240" y="662" class="t">Identity / RBAC</text>
    <text x="1240" y="682" class="s">AKS kubelet → AcrPull</text>
    <text x="1240" y="698" class="s">ACI UAMI → AcrPull</text>
    <text x="1240" y="714" class="s">Deployer → KV Secrets Officer</text>
  </g>

  <!-- Connection: Internet to ingress -->
  <path d="M160 135 H210" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="165" y="126" class="lbl">HTTPS</text>

  <!-- curved public path annotation -->
  <path d="M160 145 C180 200 200 280 246 320" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <text x="168" y="230" class="lbl">public LB IP</text>
  <text x="168" y="244" class="lbl">/emp · /to-do</text>

  <!-- Frontend to ACI -->
  <path d="M376 381 H710" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="372" class="lbl">private API call</text>

  <!-- ACI to Postgres -->
  <path d="M820 362 V405" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="830" y="390" class="lbl">SQL private</text>

  <!-- AKS/ACI to ACR pulls -->
  <path d="M690 290 H950" stroke="#0ea5e9" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="780" y="282" class="lbl">AcrPull (RBAC)</text>
  <path d="M930 315 H950 470" stroke="#0ea5e9" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>

  <!-- Agent to AKS API -->
  <path d="M331 540 V475" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="340" y="492" class="lbl">kubectl / helm / flux</text>
  <text x="340" y="506" class="lbl">(private AKS API)</text>

  <!-- AzDO to agent pool -->
  <path d="M1210 480 H690 575" stroke="#0f766e" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowTeal)"/>
  <text x="1000" y="568" class="lbl">private agent pool jobs</text>

  <!-- Pipelines push to ACR -->
  <path d="M1210 450 C1180 470 1180 490 1170 500" stroke="#0ea5e9" stroke-width="1.6" fill="none"/>
  <path d="M1170 500 H1170" stroke="#0ea5e9"/>
  <path d="M1210 500 H1170 V480" stroke="#0ea5e9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="1175" y="455" class="lbl">docker push</text>

  <!-- GitOps into Flux -->
  <path d="M1226 560 H690 350" stroke="#059669" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="980" y="340" class="lbl">GitOps sync</text>

  <!-- Secrets annotation -->
  <path d="M820 442 C900 420 940 380 966 366" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arrowOrange)"/>
  <text x="880" y="420" class="lbl">store secrets</text>

  <!-- Legend -->
  <g>
    <rect x="210" y="770" width="1330" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="230" y="794" class="h2">Legend &amp; data flow</text>

    <line x1="230" y1="820" x2="270" y2="820" stroke="#2563eb" stroke-width="2.5"/>
    <text x="280" y="824" class="leg">Public HTTPS (Users → ingress LB)</text>

    <line x1="520" y1="820" x2="560" y2="820" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="570" y="824" class="leg">Private VNet traffic (Frontend → ACI → Postgres)</text>

    <line x1="920" y1="820" x2="960" y2="820" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="970" y="824" class="leg">RBAC image pull (AcrPull)</text>

    <line x1="230" y1="850" x2="270" y2="850" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="280" y="854" class="leg">CI/CD via private agent (Helm / Flux / kubectl)</text>

    <line x1="620" y1="850" x2="660" y2="850" stroke="#059669" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="670" y="854" class="leg">GitOps (GitHub → Flux → AKS apps)</text>

    <line x1="980" y1="850" x2="1020" y2="850" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="3 3"/>
    <text x="1030" y="854" class="leg">Secrets (Postgres pwd / conn / SSH → Key Vault PE)</text>
  </g>

  <!-- Footer note -->
  <text x="800" y="970" text-anchor="middle" class="subtitle">Terraform creates cloud resources · Pipelines build images &amp; install ingress/Flux · Flux manages AKS app manifests</text>
  <text x="800" y="988" text-anchor="middle" class="s">Notes/architecture-diagram.svg · generated for learnandearn</text>
</svg>
