# Azure Pipelines - bootstrap Flux on AKS and deploy the frontend + Todo List
# apps via GitOps (reconciling gitops/clusters/aks-centralindia from this repo).
#
# MUST run on the private agent pool - same reason as the ingress pipeline.
#
# This platform repo lives in Azure DevOps, so we use `flux bootstrap git`
# against the AzDO URL (not `flux bootstrap github`).
trigger:
  branches:
    include: [main]
  paths:
    include: [gitops/**]

# azureSubscription is validated at COMPILE time. A runtime macro like
# $(armServiceConnection) from a variable group often does not expand.
parameters:
  - name: azureServiceConnection
    displayName: 'Azure Resource Manager service connection name'
    type: string
    default: 'empapp-arm'
  - name: azdoOrg
    displayName: 'Azure DevOps organization name'
    type: string
    default: 'jupalliabhishek1409'
  - name: azdoProject
    displayName: 'Azure DevOps project name'
    type: string
    default: 'learnandearn'
  - name: azdoRepo
    displayName: 'Azure DevOps git repo name (platform / gitops)'
    type: string
    default: 'learnandearn'
  - name: aciBackendPrivateIp
    displayName: 'ACI backend private IP (terraform output aci_backend_private_ip)'
    type: string
    default: '10.10.2.4'
  - name: acrLoginServer
    displayName: 'ACR login server'
    type: string
    default: 'acrempapp6ickq.azurecr.io'

pool:
  name: 'empapp-private-pool'

variables:
  - group: empapp-shared-vars
  - name: aksResourceGroup
    value: 'rg-empapp-centralindia'
  - name: aksClusterName
    value: 'aks-empapp-cin'
  - name: fluxNamespace
    value: 'flux-system'
  # Secret in empapp-shared-vars (or pipeline): azdoPersonalAccessToken
  # Needs Code (Read) on this repo so Flux can clone gitops manifests.
  # Agent-registration PAT with only Agent Pools scope is NOT enough here.

steps:
  - task: AzureCLI@2
    displayName: 'Get AKS credentials'
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials --resource-group $(aksResourceGroup) --name $(aksClusterName) --overwrite-existing

  - script: |
      set -euo pipefail
      TOKEN="$(azdoPersonalAccessToken)"
      if [ -z "$TOKEN" ]; then
        echo "##vso[task.logissue type=error]Set secret azdoPersonalAccessToken (Code Read on this repo) in empapp-shared-vars or on this pipeline."
        exit 1
      fi
      flux check --pre
      flux bootstrap git \
        --url="https://dev.azure.com/${{ parameters.azdoOrg }}/${{ parameters.azdoProject }}/_git/${{ parameters.azdoRepo }}" \
        --branch=main \
        --path=gitops/clusters/aks-centralindia \
        --token-auth \
        --username=azdo \
        --password="$TOKEN"
    displayName: 'flux bootstrap azure devops git'

  - script: |
      set -euo pipefail
      kubectl create namespace apps --dry-run=client -o yaml | kubectl apply -f -
      kubectl -n flux-system create configmap cluster-vars \
        --from-literal=ACR_LOGIN_SERVER=${{ parameters.acrLoginServer }} \
        --from-literal=BACKEND_PRIVATE_IP=${{ parameters.aciBackendPrivateIp }} \
        --from-literal=BACKEND_PORT=8000 \
        --dry-run=client -o yaml | kubectl apply -f -
    displayName: 'Write cluster-vars ConfigMap (substituted into gitops manifests by Flux)'

  - script: |
      set -euo pipefail
      flux reconcile source git flux-system
      flux reconcile kustomization apps --with-source
    displayName: 'Force an immediate reconcile'
