# Azure Pipelines - Employee App BACKEND (Node.js)
# YAML lives in this platform repo; source + Dockerfile come from
# https://github.com/cubastion-training/sample-node-app.git
#
# COMPATIBILITY PATCH: package.json only lists mysql/mysql2, but this
# platform uses PostgreSQL. Patch pg into the cloned tree before docker
# build so Dockerfile's `npm install` picks it up. The GitHub repo is
# never modified.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - pipelines/app-backend-azure-pipelines.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: empapp-shared-vars
  - name: imageRepository
    value: 'employee-app-backend'
  - name: appRepo
    value: 'https://github.com/cubastion-training/sample-node-app.git'
  - name: appDir
    value: '$(Pipeline.Workspace)/app'
  - name: tag
    value: '$(Build.BuildId)'

steps:
  - checkout: none

  - script: |
      set -euo pipefail
      git clone --depth 1 --branch main "$(appRepo)" "$(appDir)"
      ls -la "$(appDir)/Dockerfile"
    displayName: 'Clone sample-node-app'

  - script: |
      set -euo pipefail
      npm install pg pg-hstore --save --package-lock=false
    displayName: 'Patch: add pg/pg-hstore driver for PostgreSQL'
    workingDirectory: '$(appDir)'

  # Azure Database for PostgreSQL Flexible Server requires SSL. Upstream
  # dbConfig.js has no dialectOptions.ssl → SequelizeConnectionError 28000.
  # NOTE: every line under "script: |" must stay indented — bare "pool:" at
  # column 0-4 is parsed as Azure Pipelines YAML, not Python.
  - script: |
      set -euo pipefail
      cd "$(appDir)"
      python3 <<'PY'
      from pathlib import Path
      p = Path("config/dbConfig.js")
      text = p.read_text()
      needle = "    pool: {"
      insert = (
          "    dialectOptions: {\n"
          "      ssl: {\n"
          "        require: true,\n"
          "        rejectUnauthorized: false,\n"
          "      },\n"
          "    },\n"
          "    pool: {"
      )
      if "dialectOptions" in text:
          print("dialectOptions already present; skip")
      elif needle not in text:
          raise SystemExit("pool block not found in config/dbConfig.js — update the patch")
      else:
          p.write_text(text.replace(needle, insert, 1))
          print("Patched config/dbConfig.js with SSL dialectOptions")
      PY
    displayName: 'Patch: enable Postgres SSL for Azure Flexible Server'

  # sequelize-cli reads config/config.js by default, but DB settings live in
  # dbConfig.js — so migrations never created the employees table (42P01).
  - script: |
      set -euo pipefail
      cd "$(appDir)"
      python3 <<'PY'
      from pathlib import Path
      Path(".sequelizerc").write_text(
          "const path = require('path');\n"
          "module.exports = {\n"
          "  config: path.resolve('config', 'dbConfig.js'),\n"
          "  'models-path': path.resolve('models'),\n"
          "  'seeders-path': path.resolve('seeders'),\n"
          "  'migrations-path': path.resolve('migrations'),\n"
          "};\n"
      )
      startup = Path("startup.sh")
      text = startup.read_text()
      text = text.replace("npm run migration\n", "npm run migration || exit 1\n")
      startup.write_text(text)
      print(Path(".sequelizerc").read_text())
      print(startup.read_text())
      PY
    displayName: 'Patch: point sequelize-cli at dbConfig.js'

  - task: Docker@2
    displayName: 'Build and push backend image to ACR'
    inputs:
      command: buildAndPush
      repository: '$(imageRepository)'
      dockerfile: '$(appDir)/Dockerfile'
      buildContext: '$(appDir)'
      containerRegistry: '$(acrServiceConnection)'
      tags: |
        $(tag)
        latest
